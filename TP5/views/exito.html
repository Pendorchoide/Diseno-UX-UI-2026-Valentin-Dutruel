<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <script>
      try {
        if (localStorage.getItem('cubri-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (error) {
        console.warn('No se pudo leer la preferencia del tema.', error);
      }
    </script>
    <title>Confirmación | Cubrí</title>
  </head>
  <body>
    <div class="status-bar" aria-hidden="true"><span>9:41</span><span class="status-signal">5G<img src="/src/assets/figma/signal-mobile.svg" alt="" /></span></div>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Cubrí, inicio"><span class="brand-mark" aria-hidden="true"><img src="/src/assets/figma/logo-mark.svg" alt="" /></span><span>Cubrí</span></a>
      <nav class="site-nav" aria-label="Navegación principal"><a href="#">Seguros</a><a href="#">Siniestros</a><a href="mailto:hola@cubriseguros.com">Ayuda</a><a class="account-link" href="#">Mi cuenta</a></nav>
    </header>
    <main class="result-page">
      <section class="result-card success-card" aria-labelledby="success-title">
        <div class="result-icon success-icon" aria-hidden="true"><picture><source media="(max-width: 760px)" srcset="/src/assets/figma/success-mobile.svg" /><img src="/src/assets/figma/success.svg" alt="" /></picture></div>
        <div class="result-body">
          <h1 id="success-title">¡Listo, <span data-output="first-name">Juan</span>! Tu celular ya está protegido</h1>
          <p class="result-lead">Te enviamos la póliza a <span data-output="email">juan.perez@mail.com</span></p>
          <strong class="policy-number" data-output="policy-number">—</strong>
          <div class="result-details">
            <div class="summary-line"><span>Plan</span><strong data-output="plan">Plus</strong></div>
            <div class="summary-line"><span>Equipo</span><strong data-output="device">Samsung Galaxy A55</strong></div>
            <div class="summary-line"><span>Vigencia desde</span><strong data-output="policy-date">23/10/2026</strong></div>
            <div class="summary-line"><span>Cuota mensual</span><strong data-output="monthly-price">$ 3.000</strong></div>
          </div>
        </div>
        <div class="result-actions"><button class="btn" type="button" data-download-policy>Descargar póliza</button><a class="btn btn-secondary" href="/" data-reset-request>Volver al inicio</a></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
