<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="#">
                <img src="./assets/logo.png" alt="Logo" class="logo-img">
            </a>
        </div>
        <nav class="navbar">
            <ul class="nav-list">
                <li class="nav-item"><a href="#">Blog</a></li>
                <li class="nav-item"><a href="#">Juegos</a></li>
                <li class="nav-item"><a href="#">Merchandise</a></li>
                <li class="nav-item"><a href="#">Sobre nosotros</a></li>
            </ul>
        </nav>
    </header>
    <h1 class="main-title">Nuestros Productos</h1>
    <div class="card-gallerie">
        <div class="product-card">
            <a href="">
                <img src="./assets/remera-1.png" alt="remera-1">
            </a>
            <div class="product-details-container">
                <div class="product-title-container">
                    <p class="product-title">Remera Radiance</p>
                </div>
                <div class="product-sub-details-container">
                    <p class="product-price">$150.00</p>
                    <button type="button" class="product-detail-button">ver detalle</button>
                </div>
            </div>
        </div>
        <div class="product-card">
            <a href="">
                <img src="./assets/remera-2.png" alt="remera-2">
            </a>
            <div class="product-details-container">
                <div class="product-title-container">
                    <p class="product-title">Remera Knight</p>
                </div>
                <div class="product-sub-details-container">
                    <p class="product-price">$100.00</p>
                    <button type="button" class="product-detail-button">ver detalle</button>
                </div>
            </div>
        </div>
        <div class="product-card">
            <a href="">
                <img src="./assets/remera-3.png" alt="remera-3">
            </a>
            <div class="product-details-container">
                <div class="product-title-container">
                    <p class="product-title">Remera Hornet</p>
                </div>
                <div class="product-sub-details-container">
                    <p class="product-price">$100.00</p>
                    <button type="button" class="product-detail-button">ver detalle</button>
                </div>
            </div>
        </div>
        <div class="product-card">
            <a href="">
                <img src="./assets/pin-1.png" alt="pin-1">
            </a>
            <div class="product-details-container">
                <div class="product-title-container">
                    <p class="product-title">Pin Knight</p>
                </div>
                <div class="product-sub-details-container">
                    <p class="product-price">$20.00</p>
                    <button type="button" class="product-detail-button">ver detalle</button>
                </div>
            </div>
        </div>
        <div class="product-card">
            <a href="">
                <img src="./assets/llavero-1.png" alt="llavero-1">
            </a>
            <div class="product-details-container">
                <div class="product-title-container">
                    <p class="product-title">Llavero aguijón roto</p>
                </div>
                <div class="product-sub-details-container">
                    <p class="product-price">$50.00</p>
                    <button type="button" class="product-detail-button">ver detalle</button>
                </div>
            </div>
        </div>
        <div class="product-card">
            <a href="">
                <img src="./assets/llavero-2.png" alt="llavero-2">
            </a>
            <div class="product-details-container">
                <div class="product-title-container">
                    <p class="product-title">Llavero aguijón puro</p>
                </div>
                <div class="product-sub-details-container">
                    <p class="product-price">$50.00</p>
                    <button type="button" class="product-detail-button">ver detalle</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
