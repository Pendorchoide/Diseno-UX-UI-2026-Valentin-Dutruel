<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13</title>
    <link rel="stylesheet" href="styles.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <h1>¡Contactese!</h1>
        <hr>
        <form action="">
            <div class="input-area">
                <label for="name">Ingrese su nombre:</label>
                <input class="input-box" type="text" name="name" id="name" placeholder="Ingrese su nombre" required>
            </div>
    
            <div class="input-area">
                <label for="email">Ingrese su e-mail:</label>
                <input class="input-box" type="email" name="email" id="email" placeholder="Ingrese su e-mail" required>
            </div>
    
            <div class="input-area">
                <label for="message">Ingrese su mensaje:</label>
                <textarea id="message" name="message" rows="5" cols="30" placeholder="..." required></textarea>
            </div>
    
            <div>
                <input type="submit" value="Enviar" id="send-button" name="enviar">
            </div>
        </form>
        <hr>
    </div>
    
</body>
</html>
